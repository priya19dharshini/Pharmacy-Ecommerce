<article class="cart-item">
  <img
    [src]="item.imageUrl || '/assets/medicine-images/placeholder.png'"
    [alt]="item.medicineName"
    (error)="$any($event.target).src='/assets/medicine-images/placeholder.png'"
  />
  <div class="item-info">
    <h3>{{ item.medicineName }}</h3>
    <p class="unit-price">₹{{ item.unitPrice | number:'1.2-2' }} each</p>
  </div>
  <div class="quantity" aria-label="Quantity controls">
    <button type="button" (click)="changeQuantity(item.quantity - 1)"
      [disabled]="isDecrementDisabled()" aria-label="Decrease quantity">−</button>
    <span>{{ item.quantity }}</span>
    <button type="button" (click)="changeQuantity(item.quantity + 1)"
      [disabled]="isIncrementDisabled()" aria-label="Increase quantity">+</button>
  </div>
  <strong class="subtotal">₹{{ item.subtotal | number:'1.2-2' }}</strong>
  <button type="button" class="remove" (click)="removeItem()" aria-label="Remove item">
    Remove
  </button>
</article>

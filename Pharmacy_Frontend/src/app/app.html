<header class="navbar">
  <a routerLink="/" class="brand" aria-label="Pharmacy home">
    <span class="brand-mark">Rx</span>
    <span>Pharmacy</span>
  </a>

  <nav aria-label="Main navigation">
    <a routerLink="/medicines" routerLinkActive="active">Medicines</a>
    <a *ngIf="isAuthenticated" routerLink="/orders" routerLinkActive="active">My Orders</a>
    <a *ngIf="isAuthenticated" routerLink="/cart" routerLinkActive="active" class="cart-link">
      Cart <span class="cart-count">{{ cartCount }}</span>
    </a>
  </nav>
</header>

<main class="app-content">
  <router-outlet />
</main>
